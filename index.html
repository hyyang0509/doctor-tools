<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">

  <title>我的專業工具箱</title>

  <style>
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
      background: #f5f6f8;
      color: #222;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 30px;
    }

    .tool {
      display: block;
      background: white;
      padding: 18px;
      margin: 10px 0;
      border-radius: 12px;
      text-decoration: none;
      color: #222;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tool:hover {
      transform: translateY(-2px);
    }

    .tool-title {
      font-weight: bold;
      font-size: 18px;
    }

    .tool-desc {
      color: #777;
      font-size: 14px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<h1>我的專業工具箱</h1>
<div class="subtitle">Clinical & Personal Tools</div>

<div class="section">

  <h2>🏥 門診工具</h2>

  <a class="tool" href="lipid/">
    <div class="tool-title">血脂用藥工具</div>
    <div class="tool-desc">
      LDL-C 目標、Statin 強度與用藥選擇
    </div>
  </a>

  <a class="tool" href="osteoporosis/">
    <div class="tool-title">骨質疏鬆工具</div>
    <div class="tool-desc">
      FRAX、治療評估與藥物選擇
    </div>
  </a>

</div>

<div class="section">

  <h2>🏠 社區 / 長照</h2>

  <a class="tool" href="metabolic/">
    <div class="tool-title">代謝症候群</div>
    <div class="tool-desc">
      MetS 判定與管理
    </div>
  </a>

</div>

</body>
</html>
