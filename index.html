<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#173a70">
<title>我的工具箱</title>
<style>
:root{color-scheme:light;--navy:#173a70;--blue:#2d6cdf;--soft:#eaf2ff;--ink:#17243a;--muted:#66758d;--line:#dfe6f0;--surface:#fff;--bg:#f3f6fb;--shadow:0 12px 34px rgba(30,58,104,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 3%,rgba(77,136,236,.12),transparent 24rem),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55}
.page{width:min(100% - 32px,760px);margin:auto;padding:32px 0 64px}
.hero{position:relative;overflow:hidden;padding:30px;border-radius:26px;background:linear-gradient(135deg,var(--navy),#2457a5 62%,#3d7ce5);color:#fff;box-shadow:0 18px 46px rgba(23,58,112,.24)}
.hero:after{content:"";position:absolute;right:-70px;bottom:-90px;width:230px;height:230px;border:42px solid rgba(255,255,255,.08);border-radius:50%}
.brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:24px;color:rgba(255,255,255,.82);font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.brand-mark{display:grid;grid-template-columns:repeat(2,6px);gap:3px;padding:7px;border:1px solid rgba(255,255,255,.3);border-radius:9px;background:rgba(255,255,255,.1)}
.brand-mark span{width:6px;height:6px;border-radius:2px;background:#fff}
h1{position:relative;z-index:1;margin:0;font-size:clamp(2rem,7vw,2.7rem);line-height:1.15;letter-spacing:-.03em}
.subtitle{position:relative;z-index:1;margin:10px 0 0;color:rgba(255,255,255,.78)}
.section{margin-top:34px}
.section-heading{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.section-icon{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;background:var(--soft);color:var(--blue);font-size:1.1rem}
h2{margin:0;font-size:1.18rem;line-height:1.3}
.section-note{margin-left:auto;color:var(--muted);font-size:.82rem}
.tool-card,.empty-card{display:flex;min-width:0;align-items:center;gap:16px;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.tool-card{color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tool-card:hover{transform:translateY(-3px);border-color:#b7caf0;box-shadow:0 17px 38px rgba(30,58,104,.15)}
.tool-card:focus-visible{outline:3px solid rgba(45,108,223,.3);outline-offset:3px}
.tool-symbol{display:grid;width:52px;height:52px;flex:none;place-items:center;border-radius:16px;background:linear-gradient(145deg,#e8f1ff,#dbe9ff);color:var(--blue);font-size:1.45rem}
.tool-copy{min-width:0}.tool-title,.tool-desc{display:block}.tool-title{font-size:1.08rem;font-weight:750}.tool-desc{margin-top:3px;color:var(--muted);font-size:.9rem}
.arrow{display:grid;width:34px;height:34px;flex:none;place-items:center;margin-left:auto;border-radius:50%;background:var(--soft);color:var(--blue);font-size:1.15rem;transition:transform .18s ease}
.tool-card:hover .arrow{transform:translateX(3px)}
.empty-card{justify-content:center;min-height:104px;border-style:dashed;color:var(--muted);text-align:center}.empty-card strong{display:block;margin-bottom:2px;color:var(--ink);font-size:.95rem}.empty-card span{font-size:.86rem}
@media(max-width:520px){.page{width:min(100% - 20px,760px);padding-top:10px}.hero{padding:24px 21px;border-radius:22px}.brand{margin-bottom:30px}.section{margin-top:28px}.tool-card{padding:17px 15px;gap:13px}.tool-symbol{width:48px;height:48px}.section-note{display:none}.tool-desc{font-size:.86rem}}
@media(prefers-reduced-motion:reduce){.tool-card,.arrow{transition:none}}
</style>
</head>
<body>
<main class="page">
<header class="hero">
<div class="brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>Personal Workspace</div>
<h1>我的工具箱</h1>
<p class="subtitle">把常用的工作與生活工具，放在同一個地方。</p>
</header>
<section class="section" aria-labelledby="clinic-heading">
<div class="section-heading"><span class="section-icon" aria-hidden="true">✚</span><h2 id="clinic-heading">門診工具</h2><span class="section-note">Clinical tools</span></div>
<a class="tool-card" href="lipid/">
<span class="tool-symbol" aria-hidden="true">♡</span>
<span class="tool-copy"><span class="tool-title">血脂用藥工具</span><span class="tool-desc">LDL-C 目標、Statin 強度與用藥選擇</span></span>
<span class="arrow" aria-hidden="true">›</span>
</a>
</section>
<section class="section" aria-labelledby="life-heading">
<div class="section-heading"><span class="section-icon" aria-hidden="true">⌂</span><h2 id="life-heading">生活工具</h2><span class="section-note">Personal tools</span></div>
<div class="empty-card"><div><strong>工具準備中</strong><span>之後新增的生活工具會放在這裡</span></div></div>
</section>
</main>
</body>
</html>
