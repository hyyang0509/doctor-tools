<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#173a70">
<title>回診計算器｜我的工具箱</title>
<style>
:root{color-scheme:light;--navy:#173a70;--blue:#2d6cdf;--soft:#eaf2ff;--ink:#17243a;--muted:#66758d;--line:#dfe6f0;--surface:#fff;--bg:#f3f6fb;--ok:#147d4f;--okbg:#eaf8f1;--shadow:0 14px 38px rgba(30,58,104,.11)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 2%,rgba(77,136,236,.13),transparent 25rem),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55}
button,input,select{font:inherit}
.page{width:min(100% - 32px,760px);margin:auto;padding:24px 0 64px}
.back{display:inline-flex;align-items:center;gap:7px;min-height:44px;margin-bottom:10px;color:var(--blue);font-weight:700;text-decoration:none}
.back:hover{text-decoration:underline}
.hero{padding:28px 30px;border-radius:24px;background:linear-gradient(135deg,var(--navy),#2d6cdf);color:#fff;box-shadow:0 16px 42px rgba(23,58,112,.22)}
.eyebrow{margin-bottom:8px;color:rgba(255,255,255,.72);font-size:.83rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-size:clamp(1.9rem,7vw,2.55rem);line-height:1.2;letter-spacing:-.03em}
.hero p{margin:9px 0 0;color:rgba(255,255,255,.8)}
.card{margin-top:18px;padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field label{display:block;margin-bottom:7px;color:var(--muted);font-size:.9rem;font-weight:700}
.field input,.field select{width:100%;height:52px;padding:0 14px;border:1px solid #cbd6e5;border-radius:13px;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(45,108,223,.12)}
.calculate{width:100%;min-height:54px;margin-top:18px;border:0;border-radius:14px;background:linear-gradient(135deg,#245ebf,var(--blue));color:#fff;font-weight:800;letter-spacing:.02em;cursor:pointer;box-shadow:0 9px 22px rgba(45,108,223,.24);touch-action:manipulation}
.calculate:hover{filter:brightness(1.05)}
.calculate:focus-visible{outline:3px solid rgba(45,108,223,.3);outline-offset:3px}
.note{margin:13px 2px 0;color:var(--muted);font-size:.82rem}
.result{display:none;margin-top:18px;padding:24px;border:1px solid #b9e3cf;border-radius:20px;background:var(--okbg);color:var(--ok);text-align:center}
.result.show{display:block}
.result-label{font-size:.86rem;font-weight:700}
.result-date{margin:5px 0 1px;font-size:clamp(2rem,9vw,3rem);font-weight:850;line-height:1.15;letter-spacing:-.035em}
.result-weekday{font-size:1.02rem;font-weight:750}
.result-detail{margin-top:12px;padding-top:12px;border-top:1px solid rgba(20,125,79,.18);font-size:.88rem}
.error{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff0ee;color:#b42318;font-size:.9rem;font-weight:650}
.error.show{display:block}
@media(max-width:560px){.page{width:min(100% - 20px,760px);padding-top:8px}.hero{padding:24px 21px;border-radius:21px}.card{padding:18px 15px}.fields{grid-template-columns:1fr;gap:13px}.field input,.field select{height:50px}.result{padding:22px 15px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="page">
<a class="back" href="../" aria-label="返回我的工具箱">‹ 返回工具箱</a>
<header class="hero">
<div class="eyebrow">Personal tools</div>
<h1>回診計算器</h1>
<p>快速計算下次領藥或回診日期。</p>
</header>
<section class="card" aria-label="日期計算">
<div class="fields">
<div class="field">
<label for="startDate">起始日期</label>
<input id="startDate" type="date" required>
</div>
<div class="field">
<label for="interval">回診間隔</label>
<select id="interval">
<option value="w1">1 週</option>
<option value="w2">2 週</option>
<option value="w3">3 週</option>
<option value="w4">4 週</option>
<option value="m1">1 個月</option>
<option value="m2">2 個月</option>
<option value="m3">3 個月</option>
<option value="m6">6 個月</option>
<option value="m12">12 個月</option>
</select>
</div>
</div>
<button class="calculate" id="calculate" type="button">計算日期</button>
<p class="note">週數以每週 7 天計算；月份以曆月同日計算。若目標月份沒有同一天，則取該月最後一天。</p>
<div class="error" id="error" role="alert"></div>
</section>
<section class="result" id="result" aria-live="polite">
<div class="result-label">下次領藥／回診日期</div>
<div class="result-date" id="resultDate"></div>
<div class="result-weekday" id="resultWeekday"></div>
<div class="result-detail" id="resultDetail"></div>
</section>
</main>
<script>
(function(){
  'use strict';
  var startInput=document.getElementById('startDate');
  var intervalInput=document.getElementById('interval');
  var result=document.getElementById('result');
  var errorBox=document.getElementById('error');
  var weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  function pad(n){return String(n).padStart(2,'0')}
  function toIso(p){return p.y+'-'+pad(p.m)+'-'+pad(p.d)}
  function utcDate(y,m,d){
    var date=new Date(0);
    date.setUTCHours(0,0,0,0);
    date.setUTCFullYear(y,m-1,d);
    return date;
  }
  function daysInMonth(y,m){return utcDate(y,m+1,0).getUTCDate()}
  function validParts(p){return p&&p.y>=1&&p.y<=9999&&p.m>=1&&p.m<=12&&p.d>=1&&p.d<=daysInMonth(p.y,p.m)}

  function parseIso(value){
    var match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if(!match)return null;
    var p={y:Number(match[1]),m:Number(match[2]),d:Number(match[3])};
    return validParts(p)?p:null;
  }

  function addDays(p,n){
    var date=utcDate(p.y,p.m,p.d);
    date.setUTCDate(date.getUTCDate()+n);
    return {y:date.getUTCFullYear(),m:date.getUTCMonth()+1,d:date.getUTCDate()};
  }

  function addMonths(p,n){
    var total=p.y*12+(p.m-1)+n;
    var y=Math.floor(total/12);
    var m=total-y*12+1;
    return {y:y,m:m,d:Math.min(p.d,daysInMonth(y,m))};
  }

  function formatDate(p){return p.y+' 年 '+p.m+' 月 '+p.d+' 日'}
  function weekday(p){return weekdays[utcDate(p.y,p.m,p.d).getUTCDay()]}

  function calculate(){
    var start=parseIso(startInput.value);
    if(!start){
      errorBox.textContent='請先選擇有效的起始日期。';
      errorBox.classList.add('show');
      result.classList.remove('show');
      startInput.focus();
      return;
    }
    var code=intervalInput.value;
    var amount=Number(code.slice(1));
    var isWeek=code.charAt(0)==='w';
    var target=isWeek?addDays(start,amount*7):addMonths(start,amount);
    var label=intervalInput.options[intervalInput.selectedIndex].text;
    if(!validParts(target)){
      errorBox.textContent='計算結果超出支援的日期範圍。';
      errorBox.classList.add('show');
      result.classList.remove('show');
      return;
    }

    errorBox.classList.remove('show');
    document.getElementById('resultDate').textContent=formatDate(target);
    document.getElementById('resultWeekday').textContent=weekday(target);
    document.getElementById('resultDetail').textContent='從 '+formatDate(start)+' 往後 '+label;
    result.classList.add('show');
    result.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  var now=new Date();
  startInput.value=toIso({y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate()});
  document.getElementById('calculate').addEventListener('click',calculate);
  startInput.addEventListener('keydown',function(e){if(e.key==='Enter')calculate()});
  intervalInput.addEventListener('keydown',function(e){if(e.key==='Enter')calculate()});

  window.followupCalculator={parseIso:parseIso,addDays:addDays,addMonths:addMonths,toIso:toIso,calculate:calculate};
})();
</script>
</body>
</html>
